name: Release unsigned IPA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # The project needs Xcode 16 or newer (objectVersion 90).
          # latest-stable tracks whatever the runner image ships, so this
          # keeps working when GitHub refreshes the macOS image.
          xcode-version: "latest-stable"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version || true
          rustup --version || true

      - name: Install Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios || true

      - name: Build patched AirliftFFI
        run: bash scripts/build-airlift-xcframework.sh

      - name: Verify vendored Airlift
        run: bash scripts/verify-airlift.sh

      - name: Read app version
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' airbeep.xcodeproj/project.pbxproj | head -n 1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$VERSION" >&2
            exit 1
          fi

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project airbeep.xcodeproj \
            -scheme airbeep \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/airbeep.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify archived Airlift integration
        run: bash scripts/verify-airlift.sh "$RUNNER_TEMP/airbeep.xcarchive/Products/Applications/airbeep.app" "$VERSION"

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/airbeep.xcarchive/Products/Applications/airbeep.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "airipcc-lite-v${VERSION}-unsigned.ipa" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: airipcc-lite-v${{ env.VERSION }}-unsigned
          path: ${{ runner.temp }}/airipcc-lite-v${{ env.VERSION }}-unsigned.ipa

      - name: Publish GitHub release
        # workflow_dispatch deliberately excluded: a manual run only uploads
        # the unsigned-IPA artifact for testing, never publishes a release.
        if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AirIPCC Lite v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/airipcc-lite-v${{ env.VERSION }}-unsigned.ipa
